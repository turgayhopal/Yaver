# Yaver - ayar dosyasi
# Platforma ozel HER SEY burada. Pi'ye tasirken sadece bu dosyayi degistireceksin.

mqtt:
  server: 127.0.0.1         # "localhost" degil - bazi sistemlerde IPv6 (::1) once denenip zaman
                              # asimina ugruyor, sonra IPv4'e dusuyor (bkz. llm.local.server ayni not).
                              # Pi'ye tasiyinca buraya PC'nin IP'sini yazacaksin
  port: 1883
  topic_text: yaver/speech/text
  topic_reply: yaver/reply/text
  topic_status: yaver/status
  topic_control: yaver/control  # ear -> brain/mouth: {"command": "stop"} (soz kesme)
  username: null              # Mosquitto kimlik dogrulamasi acilinca kullanici adi (sifre secrets.yaml'da
                              # mqtt_password). null = anonim. Bkz. CLAUDE.md "Mosquitto kimlik dogrulama"

face:
  # Masaustu widget'i (face.py) - yaver/status'u dinleyip kucuk, her seyin
  # ustunde saydam bir pencerede sinirsel aktivite gosterir. Ana ses/LLM
  # hattina dokunmaz, sadece MQTT dinler.
  width: 168
  height: 220
  margin_right: 24   # ekranin sag kenarindan uzaklik (piksel)
  margin_bottom: 48  # ekranin alt kenarindan uzaklik (piksel) - gorev cubugunu
                      # atlamak icin, sadece screen.height kullanildigindan
                      # (bkz. face.py) buraya tam gorev cubugu yuksekligini +
                      # bir miktar bosluk dahil et - hala tam degilse artir/azalt
  screen_index: 0    # birden fazla monitor varsa hangisine yerlesecek (0 = birincil)
  backdrop_sample_sec: 2.0       # arka plan (masaustu) ne kadar surede bir orneklenip
                                   # acik/koyu kontrast paketi arasinda gecis yapilsin
  backdrop_light_threshold: 140  # 0-255 ortalama parlaklik - bunun ustu "light" sayilir
  backdrop_sample_width: 90      # widget'in solunda orneklenen masaustu seridinin genisligi (piksel)
  gui: qt                        # pywebview arka ucu. qt: gercek pencere saydamligi destekliyor
                                  # (Windows'un varsayilani WinForms/WebView2 desteklemiyor)
  env: {}                        # Qt yuklenmeden once ayarlanacak ortam degiskenleri

skills:
  topic_request: yaver/skill/request   # brain -> skills: {"id","name","params"}
  topic_result: yaver/skill/result     # skills -> brain: {"id","name","status","data"}
  topic_list: yaver/skill/list         # skills -> brain: mevcut araclarin listesi (retained)
  topic_event: yaver/skill/event       # skills -> brain: arka planda biten is (zamanlayici, delegate_task)
  topic_memory: yaver/memory           # skills -> brain (retained): kalici bilgiler (memory.json'un sahibi skills)
  timeout_sec: 30.0                    # brain bir arac sonucunu en fazla bu kadar bekler (komutlar/ssh icin uzun;
                                       # cihaz onayi kendi kisa suresiyle - device_ack_timeout_sec - biter)
  list_wait_sec: 2.0                   # brain acilista LLM'i isitmadan once arac listesini en fazla bu kadar bekler
  workers: 4                           # araclar bu kadar thread'de paralel calisir (MQTT ag thread'i hic bloklanmaz)
  device_ack_timeout_sec: 2.0          # cihaz (orn. Pico) "yaptim" onayini en fazla bu kadar bekle, yoksa hata
  command_timeout_sec: 20              # run_command: bir komutun varsayilan en uzun suresi
  output_max_chars: 1500               # komut/ajan ciktisi LLM'e en fazla bu kadar verilir
  timer_max_sec: 86400                 # en uzun zamanlayici (1 gun)
  memory_file: memory.json             # remember/forget'in yazdigi kalici hafiza (goreli = proje koku)
  delegate:
    # delegate_task: karmasik isi (kod yazma, derleme, uzak sunucuda inceleme)
    # arka planda Claude Code'a devreder. INTERNET ISTER ve gercek dunyada
    # etki eder (dosya yazar, komut calistirir) - bu yuzden varsayilan kapali,
    # acilinca her cagri sesli onay ister. Acmadan once: Mosquitto kimlik
    # dogrulamasi (yoksa ag'daki herkes yaver/skill/request'e yazabilir).
    enabled: false
    workdir: "~"                       # ajanin calisacagi klasor (goreli = proje koku, ~ = ev dizini)
    timeout_sec: 900
    command:                           # sonuna gorev metni eklenir. Kabuk YOK, arguman listesi.
      - claude
      - -p
      - --append-system-prompt
      - "Sonucu Türkçe, en fazla üç kısa cümleyle özetle; sesli okunacak. Markdown ve kod bloğu kullanma."
      - --permission-mode
      - acceptEdits                    # dosya duzenleyebilir; Bash vb. icin --allowedTools ile acikca izin ver

devices:
  # Genel cihaz kayit defteri - burada tanimli her cihaz, ayni "type"a sahip
  # skill'ler tarafindan otomatik gorulur (bkz. skills.py devices_by_type()).
  # Yeni bir fiziksel LED/kart eklemek icin sadece buraya yeni bir girdi ekle,
  # skill kodu degismez. Anahtar (orn. pico_led_masa) MQTT topic'inde ve
  # LLM'in sececegi kimlik olarak kullanilir - benzersiz ve sabit tut.
  pico_led_masa:
    type: led                          # skill'lerin cihazi filtrelemek icin kullandigi tur etiketi
    label: "masadaki Pico W'nin dahili LED'i"  # LLM'e gosterilir, "hangi cihaz" ayrimini bununla yapar
    topic: yaver/device/pico_led_masa    # bu cihaz bu konuyu dinler, "on"/"off" payload'u bekler
    ack_topic: yaver/device/pico_led_masa/state  # cihaz uyguladigi durumu buraya yazar; skill bunu bekler.
                                                 # Satiri silersen eski davranis: onay beklenmez

commands:
  # run_command araci: onceden tanimli, ADLANDIRILMIS komutlar. LLM sadece adi
  # secer, komutu kendisi yazamaz. Uzaktaki kartlara erisim icin ssh kullan
  # (anahtarla, sifresiz giris: ssh-copy-id), orn:
  #   pi_sicaklik:
  #     label: "Raspberry Pi'nin işlemci sıcaklığını söyler"
  #     command: [ssh, -o, ConnectTimeout=5, pi@192.168.1.50, vcgencmd, measure_temp]
  #   pi_yeniden_baslat:
  #     label: "Raspberry Pi'yi yeniden başlatır"
  #     command: [ssh, pi@192.168.1.50, sudo, reboot]
  #     confirm: true            # geri alinamaz: sesli onay ister
  # Komutlar platforma ozeldir - bu yuzden kodda degil burada.
  pc_uptime:
    label: "Bu bilgisayarın ne kadar süredir açık olduğunu söyler"
    command: [uptime, -p]
  pc_disk:
    label: "Bu bilgisayarın disk doluluğunu söyler"
    command: [df, -h, --output=pcent,target, /, /home]

launcher:
  # main.py'nin tek komuttan baslattigi surecler. Her biri hala AYRI bir
  # isletim sistemi sureci - main.py sadece elle ayri terminallerde girilen
  # komutlari tek yerden calistirir, modullerin birbirini tanimasi/dogrudan
  # cagirmasi yok (iletisim yine sadece MQTT). LLM sunucusu ve MQTT broker'i
  # BURADAN BASLATILMAZ, arka planda calisan servisler olarak beklenir.
  modules:          # main.py bunlari sirayla baslatir (ayni python yorumlayicisiyla, sys.executable)
    - skills.py
    - brain.py
    - mouth.py
    - ear.py
    - face.py
  check_timeout_sec: 3.0   # acilista broker/LLM ulasilabilirlik kontrolu icin bekleme
  stop_timeout_sec: 5.0    # Ctrl+C'de bir surecin kapanmasi icin bekleme, sonra zorla oldurulur

llm:
  # Yaver'in hangi LLM'i kullanacagi. Brain bu bolumden okur, kodda hicbir
  # model/sunucu adi yok - degistirmek icin sadece burayi duzenle.
  #   local: OpenAI uyumlu /v1/chat/completions sunan yerel bir sunucu
  #          (Ollama, llama.cpp llama-server, LM Studio...) - internet gerekmez.
  #   claude: Anthropic Claude API - INTERNET ISTER, ucretli, API anahtari
  #           secrets.yaml'da (anthropic_api_key) ya da ANTHROPIC_API_KEY'de.
  #           Bilincli secimdir: secilince SADECE o kullanilir, yerel model
  #           yedek degildir (bkz. CLAUDE.md degismez kisit 1).
  provider: local
  warm_up: true                      # brain acilista LLM'i isitsin (local: modeli yukleyip promptu
                                     # onbellege alir; claude: baglantiyi acip anahtari dogrular)
  claude:
    model: claude-haiku-5-5          # en hizli/ucuz Claude - sesli asistan icin gecikme oncelikli.
                                     # Daha zeki ama daha yavas: claude-sonnet-5-5
    max_tokens: 1024                 # dusunme (thinking) de bu sinira dahil - cevabin kisaligi promptta
    timeout_sec: 60
    max_retries: 1
    request_options:                 # her istege eklenecek alanlar
      thinking: {type: adaptive}     # model gerekirse kisaca dusunur, basit soruda dusunmez
      output_config: {effort: low}   # low = en hizli. Cevaplar yetersizse medium dene
                                     # (temperature GONDERILMEZ - Haiku 5.5 reddediyor)
  local:
    server: http://127.0.0.1:11434  # Ollama varsayilani. llama.cpp icin orn. :8080.
                                     # "localhost" degil bilerek - bazi sistemlerde IPv6 (::1)
                                     # once denenip zaman asimina ugruyor, her istege ~2 sn
                                     # sabit gecikme ekliyordu (Windows'ta olculdu)
    model: yaver-qwen3-4b            # = qwen3:4b-instruct + num_ctx 4096 (ollama/yaver-qwen3-4b.Modelfile).
                                     # duz "qwen3:4b" DEGIL - o dusunen (thinking) surum, sesli
                                     # asistan icin cok yavas ve Ingilizce muhakeme sizdiriyor
                                     # (olculdu, bkz. CLAUDE.md "LLM sunucusu notlari")
    request_options:                 # her istege eklenecek ek alanlar (sunucuya ozel)
      keep_alive: 30m                # Ollama: model son istekten bu kadar sonra VRAM'den cikar.
                                     # Kisa olursa ilk soru ~12 sn bekler (soguk yukleme, olculdu);
                                     # -1 = hic cikma (GPU'yu Yaver kapaliyken de tutar).
                                     # llama.cpp bu alani yok sayar.
                                     # Not: Ollama /v1 uzerinden num_ctx'i YOK SAYIYOR (olculdu) -
                                     # baglam boyutu sunucu tarafinda (OLLAMA_CONTEXT_LENGTH,
                                     # varsayilan 4096 - sistem promptu + 4 tur gecmis icin yeterli)
    timeout_sec: 120                 # bir LLM isteginin en fazla suresi

brain:
  history_turns: 4        # kac konusma turu hatirlansin. Kucuk model uzun gecmiste
                            # kendi kaliplarini (dolgu cumleleri) tekrarlamaya basliyor,
                            # bu yuzden dusuk tutuluyor - sadece kisa vadeli takip
                            # sorularini ("bir tane daha oner") hatirlamasi yeterli.
  history_trim_to: 2        # sinir asilinca gecmis bu kadar tura indirilir (tek tek kaydirilmaz).
                            # Her turda kaydirmak LLM onbellegini her soruda bozup gecmisin
                            # tamamini yeniden isletiyordu (olculdu: +0,6 sn/soru). Bkz. add_turn()
  temperature: 0.4         # sadece local (Claude'a gonderilmez)
  max_tokens: 160           # sadece local - sesli cevap kisa olmali (Claude: llm.claude.max_tokens)
  min_sentence_chars: 12    # bundan kisa cumle ("Tamam.") tek basina seslendirilmez, sonrakiyle birlesir
  max_tool_rounds: 3        # bir soruda en fazla kac arac adimi ("ikisini de kapat", "saati soyle
                            # ve zamanlayici kur"). Sonra araclar kapatilip cevap istenir
  repeat_window_turns: 3    # son bu kadar cevapta birebir gecen cumle tekrar soylenmez (ilk cumle haric)
  confirm_timeout_sec: 30   # riskli arac icin "Onayliyor musun?" sorusunun gecerlilik suresi
  tool_filler_sec: 1.5      # arac bu sureden uzun surerse bir kez tool_filler soylenir (sessizlik olmasin)
  tool_filler: "Bir saniye, bakıyorum."
  llm_error_reply: "Beynime ulaşamıyorum, bağlantıda bir sorun var."
  system_prompt: |
    Sen Yaver'sin: evdeki bilgisayarda çalışan, Türkçe konuşan bir sesli asistan.
    Kullanıcıyla sesli konuşuyorsun; söylediğin her şey hoparlörden okunuyor.
    Samimi, doğal ve yardımsever konuş; bir arkadaş gibi, ama lafı uzatmadan.

    Kullanıcının sözleri konuşma tanıma sisteminden yazıya çevrilip sana
    geliyor, bu yüzden metinde yanlış duyulmuş kelimeler olabilir ("koldu"
    aslında "kod", "Ya var" aslında "Yaver" olabilir). Cümlenin en olası
    anlamını tahmin et ve ona göre cevap ver. Anlam gerçekten çıkarılamıyorsa
    neyi anlamadığını tek cümleyle sor.

    Nasıl konuşursun:
    - Genelde bir iki cümle; konu gerektiriyorsa en fazla dört cümle.
    - Sadece düz konuşma metni: madde işareti, başlık, kod, tablo, emoji yok.
    - Sayıları, saatleri ve tarihleri yazıyla yaz ("on dört otuz", "üç derece").
    - Türkçe karakterleri her zaman doğru kullan (ç, ğ, ı, ö, ş, ü).
    - Kendinden birinci şahısla bahset. Cevabına "Ben Yaver" diye başlama,
      kendini sadece sorulursa tanıt.
    - Soruyu cevaplayınca dur; kapanış nezaketi ya da "başka bir şey var mı"
      gibi dolgu cümleleri ekleme. Önceki cevaplarını kelimesi kelimesine
      tekrarlama.

    Araçların:
    - Sana tanıtılan araçlarla gerçek işler yapabilirsin: cihaz kontrolü,
      saat ve tarih, hesap, zamanlayıcı, hafızaya yazma ve tanımlı komutlar.
      İş bir araçla yapılabiliyorsa aracı çağır; yapılamıyorsa bunu açıkça söyle.
    - Saat, tarih ve gün bilgisini sadece get_datetime aracından al, asla tahmin etme.
    - Bir işi yaptığını sadece aracı bu istek için gerçekten çağırdıysan ve sonuç
      başarılıysa söyle. Araç hata döndürdüyse ne olduğunu kısaca anlat. Geçmişte
      aynı işi yapmış olman yeterli değil; her istekte aracı yeniden çağır.
    - Hangi cihazın kastedildiği belli değilse tahmin etme, sor.
    - Araç sonucu "needs_confirmation" ise işlem henüz yapılmadı: ne yapacağını
      söyleyip onay iste.
    - Bilmediğin bir bilgiyi uydurma. Güncel olaylar ya da internet bilgisi
      gerekiyorsa erişimin olmadığını söyle.

  no_tools_note: |          # skills kapaliyken (hic arac yokken) sistem promptuna eklenir
    ŞU AN ARAÇLARIN KAPALI: hiçbir cihazı kontrol edemiyorsun, saati de
    bilmiyorsun. Böyle bir şey istenirse şu an yapamadığını kısaca söyle;
    yapmış gibi konuşma.

mouth:
  voice_model: voices/tr_TR-dfki-medium.onnx   # goreli yol = proje kokune gore
  output_device: null      # null = sistemin varsayilan cikisi. Ad parcasi da yazilabilir (orn. "pulse")
  volume: 1.0
  synthesis:                # Piper'in SynthesisConfig'i - dinleyerek secildi
                             # (4 varyant karsilastirildi, bu en net/dogal geldi)
    length_scale: 1.05       # >1 = biraz yavas, telaffuzu netlestiriyor
    noise_scale: 0.2         # dusuk = daha az "gurultu", daha temiz ses
    noise_w_scale: 0.3       # dusuk = daha deterministik/az degisken tempo
  ack_phrases:              # uyandirma kelimesinden sonra rastgele biri soylenir
    - Efendim
    - Seni dinliyorum
    - Buyurun
    - Dinliyorum
  reply_gap_sec: 1.5        # brain cumle cumle yayinlarken aralarda kuyruk bosalabilir -
                             # bu kadar sure yeni cumle gelmezse "done" (bitti) yayinla

audio:
  input_device: 0           # null = sistemin varsayilan girisi. find_microphone.py ile numara/ad ogren;
                            # numara makineden makineye degisir, ad parcasi (orn. "USB") daha kalicidir
  sample_rate: 16000        # openWakeWord ve Whisper 16 kHz ister, degistirme
  block_size: 1280          # 80 ms. openWakeWord bu boyutu bekler, degistirme
  settle_sec: 0.5           # mikrofon akisi acildiktan sonra oturmasi icin bekleme (yoksa ortam olcumu sifir cikar)
  source_name: ear-pc       # yaver/speech/text'teki "source" alani - bu kulagin kimligi (Pi'de orn. ear-pi)

wakeword:
  enabled: false            # false: surekli dinle, cumlede trigger_word gecince cevap ver.
                            # true: openWakeWord ile ayri iki asamali uyandirma (asagidaki model/threshold kullanilir)
  trigger_word: yaver       # enabled: false iken cevap vermek icin cumlede gecmesi gereken kelime
  model: hey_jarvis         # enabled: true iken kullanilir. kendi "Yaver" modelini sonra egitecegiz
  threshold: 0.5            # dusurursen daha kolay uyanir ama yanlis alarm artar
  cooldown_sec: 2.0         # uyandiktan sonra tekrar dinlemeye gecis beklemesi
  followup_sec: 6.0         # Yaver konusmayi bitirdikten sonra bu kadar sure "yaver" demeden devam
                            # edilebilir ("Onayliyor musun?" -> "evet"). 0 = kapali, her cumlede "yaver" gerekir
  ack_wait_sec: 3.0         # "efendim" bitene kadar en fazla bu kadar bekle
  ack_tail_sec: 0.15        # "efendim" bittikten sonra hoparlorun tamamen susmasi icin pay

barge_in:
  # Soz kesme: Yaver konusurken "Yaver dur" / "Yaver sus" denince susar.
  # Hoparlor sesi mikrofona da girdigi icin konusma esigi bu sirada yukseltilir
  # ve cumlede HEM tetik kelime HEM bir dur kelimesi gecmesi gerekir.
  enabled: true
  threshold_multiplier: 2.0 # Yaver konusurken konusma esigi bu kadar katina cikar (hoparlor yankisi)
  stop_words: [dur, sus, yeter, kes, sessiz, sesiz]
  mute_sec: 3.0             # durduktan sonra yarim kalan cevabin gec gelen cumleleri en fazla bu kadar yutulur

recording:
  silence_multiplier: 2.5   # ortam gurultusunun kac kati "konusma" sayilsin
  min_threshold: 180        # konusma esigi bunun altina inmesin (cok sessiz odada her tikirti tetiklemesin)
  ambient_sec: 1.5          # acilista ortam gurultusu bu kadar sure olculur
  pre_roll_sec: 0.6         # tetiklenmeden onceki bu kadar ses kayda eklenir (cumlenin ilk hecesi)
  silence_sec: 0.8          # bu kadar sessizlik olunca kayit biter
  max_sec: 15
  min_sec: 0.7               # bundan kisa kayitlari coplugu at
  cooldown_sec: 0.3         # bir kayit islendikten sonra tekrar dinlemeden once bekleme (tetik kelime modu)

whisper:
  model: small                 # GPU + int8_float16 ile hizli, base'den cok daha isabetli. Pi'de: tiny/base
  device: cuda                 # Pi'de: cpu
  compute_type: int8_float16   # GTX 1660'ta Tensor Core yok, float16 yavas/duzensiz calisiyordu. Pi'de: int8
  language: tr
  hotwords: "Yaver LED kod yazılım zamanlayıcı"  # nadir/yabanci kelimeler icin Whisper'a ipucu (yanlis duymayi azaltir).
                                # yeni bir skill nadir bir kelime/isim kullanirsa buraya da ekle
  beam_size: 1                 # 1 = en hizli (greedy). Artirmak isabeti biraz artirir, yavaslatir
  temperature: 0.0
  vad_filter: true             # Whisper'in kendi ses etkinlik filtresi - sessiz kisimlari atlar
  no_speech_threshold: 0.6     # bu olasiligin ustunde "konusma yok" sayilir
  junk_phrases:                # Whisper sessizlik/gurultu uzerine bunlari uydurur, coplugu at.
    - them                     # Karsilastirma buyuk/kucuk harf, aksan ve noktalamadan bagimsiz.
    - you
    - thank you
    - thanks for watching
    - bye
    - Altyazı M.K.
    - Altyazı
    - Abone ol
    - Abone olmayı unutmayın
    - İzlediğiniz için teşekkürler
    - Teşekkürler
