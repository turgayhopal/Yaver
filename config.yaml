# Yaver - ayar dosyasi
# Platforma ozel HER SEY burada. Pi'ye tasirken sadece bu dosyayi degistireceksin.

mqtt:
  server: 127.0.0.1         # "localhost" degil - Windows'ta IPv6 (::1) once denenip zaman
                              # asimina ugruyor, sonra IPv4'e dusuyor (bkz. brain.server ayni not).
                              # Pi'ye tasiyinca buraya PC'nin IP'sini yazacaksin
  port: 1883
  topic_text: yaver/speech/text
  topic_reply: yaver/reply/text
  topic_status: yaver/status

face:
  # Masaustu widget'i (face.py) - yaver/status'u dinleyip kucuk, her seyin
  # ustunde saydam bir pencerede sinirsel aktivite gosterir. Ana ses/LLM
  # hattina dokunmaz, sadece MQTT dinler.
  width: 168
  height: 220
  margin_right: 24   # ekranin sag kenarindan uzaklik (piksel)
  margin_bottom: 48  # ekranin alt kenarindan uzaklik (piksel) - gorev cubugunu
                      # atlamak icin, sadece screen.height kullanildigindan
                      # (bkz. face.py) buraya tam gorev cubugu yuksekligini +
                      # bir miktar bosluk dahil et - hala tam degilse artir/azalt
  screen_index: 0    # birden fazla monitor varsa hangisine yerlesecek (0 = birincil)
  backdrop_sample_sec: 2.0       # arka plan (masaustu) ne kadar surede bir orneklenip
                                   # acik/koyu kontrast paketi arasinda gecis yapilsin
  backdrop_light_threshold: 140  # 0-255 ortalama parlaklik - bunun ustu "light" sayilir

skills:
  topic_request: yaver/skill/request   # brain -> skills: {"id","name","params"}
  topic_result: yaver/skill/result     # skills -> brain: {"id","name","status","data"}
  topic_list: yaver/skill/list         # skills -> brain: mevcut araclarin listesi (retained)
  timeout_sec: 5.0                     # bir arac cagrisinin sonucu icin en fazla bekleme

devices:
  # Genel cihaz kayit defteri - burada tanimli her cihaz, ayni "type"a sahip
  # skill'ler tarafindan otomatik gorulur (bkz. skills.py led_devices()).
  # Yeni bir fiziksel LED/kart eklemek icin sadece buraya yeni bir girdi ekle,
  # skill kodu degismez. Anahtar (orn. pico_led_masa) MQTT topic'inde ve
  # LLM'in sececegi kimlik olarak kullanilir - benzersiz ve sabit tut.
  pico_led_masa:
    type: led                          # skill'lerin cihazi filtrelemek icin kullandigi tur etiketi
    label: "masadaki Pico W'nin dahili LED'i"  # LLM'e gosterilir, "hangi cihaz" ayrimini bununla yapar
    topic: yaver/device/pico_led_masa    # bu cihaz bu konuyu dinler, "on"/"off" payload'u bekler

launcher:
  # main.py'nin tek komuttan baslattigi surecler. Her biri hala AYRI bir
  # isletim sistemi sureci - main.py sadece elle ayri terminallerde girilen
  # komutlari tek yerden calistirir, modullerin birbirini tanimasi/dogrudan
  # cagirmasi yok (iletisim yine sadece MQTT).
  llama_server:
    binary: C:/yaver/llama/llama-server.exe
    model: C:/yaver/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    ctx_size: 8128
    n_gpu_layers: 99
    port: 8080
    parallel: 1   # tek KV-cache slotu - bkz. Commands.txt/CLAUDE.md notu, onbellek hep sicak kalsin diye
    # --cache-type-k/v q8_0: KV-cache'i 8-bit'e indirir. GTX 1660'ta uretim
    # hizini sinirlayan sey Tensor Core degil (yok), bellek bant genisligi -
    # KV-cache trafigini yariya indirmek token/sn'yi artirabilir (kucuk bir
    # kalite riskiyle). --flash-attn on: varsayilan 'auto' bu eski (Turing)
    # GPU icin kapali kalmis olabilir, acikca 'on' deneniyor. DENEYSEL - ise
    # yaramazsa ikisini de kaldir (once --flash-attn, sonra cache-type).
    #
    # --cache-reuse 256: brain.py'nin history'si sabit boyutlu bir pencere
    # (history_turns) - dolunca en eski tur dusup yenisi eklenir (FIFO).
    # Pencere kaydiginda onceki istekle ORTAK ONEK sadece sistem promptunda
    # kaliyor, geri kalan tum baglam (900-1400 token, ozellikle arac cagrisi
    # turlari agir) SIFIRDAN islenip yaniti yavaslatiyordu (yasanmis ve
    # olculmus bir gecikme - "artik 1 sn altinda degil" sikayeti). Bu bayrak
    # KV-shifting ile kaymis onbellegi de yeniden kullanmayi dener.
    extra_args: [
      "--jinja", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0",
      "--flash-attn", "on", "--cache-reuse", "256",
    ]
  modules:          # main.py bunlari sirayla baslatir (ayni python yorumlayicisiyla, sys.executable)
    - skills.py
    - brain.py
    - mouth.py
    - ear.py
    - face.py

brain:
  server: http://127.0.0.1:8080   # "localhost" degil bilerek - Windows'ta IPv6 (::1) once
                                    # denenip zaman asimina ugruyor, sonra IPv4'e dusuyor -
                                    # bu her istekte ~2 sn sabit gecikme ekliyor (olculdu)
  history_turns: 4         # kac konusma turu hatirlansin. Kucuk model uzun gecmiste
                            # kendi kaliplarini (dolgu cumleleri) tekrarlamaya basliyor,
                            # bu yuzden dusuk tutuluyor - sadece kisa vadeli takip
                            # sorularini ("bir tane daha oner") hatirlamasi yeterli.
  temperature: 0.4
  max_tokens: 160           # sesli cevap kisa olmali
  stream: true              # cumle biter bitmez seslendir (gecikmeyi yariya indirir)
  system_prompt: |
    Sen Yaver adında, Türkçe konuşan bir sesli asistansın.
    Cevapların SESLİ okunacak, bu yüzden:
    - Kısa konuş. En fazla 2-3 cümle.
    - Madde işareti, başlık, emoji, kod bloğu KULLANMA.
    - Sayıları rakam yerine yazıyla yaz (2025 değil, iki bin yirmi beş).
    - Bilmiyorsan bilmediğini söyle, uydurma.
    - Şu anki tarih, saat ve hava durumu hakkında HİÇBİR bilgin yok. Sorulursa
      bilmediğini söyle, ASLA tarih veya hava tahmini uydurma.
    - Bir cihazı değiştirmen istendiğinde (örn. LED aç/kapat) SADECE ilgili
      aracı gerçekten çağırarak yapabilirsin. Aracı çağırmadan "yaptım",
      "açıldı", "söndü" gibi bir şeyi başardığını ASLA söyleme - önceki
      konuşmada bir araç çağırmış olman, şimdiki istek için de çağırmana
      gerek olmadığı anlamına gelmez, her istek için ayrı ayrı çağır. Aşağıdaki
      konuşma geçmişinde bir önceki LED isteğinde araç çağırmadan cevap
      verilmiş gibi görünse bile SEN yine de gerçekten çağır - geçmişi
      TAKLİT ETME, bu bir hataydı.
    - Bir aracın "hangi cihaz" seçeneği (device gibi) varsa ve kullanıcı
      hangisini kastettiğini belirtmediyse ya da net değilse: ASLA tahmin
      etme, rastgele bir cihaz seçme, veya aracı hiç çağırmadan başardığını
      söyleme - bunun yerine kullanıcıya hangi cihazı kastettiğini sor.
    - Kendinden bahsederken HER ZAMAN birinci şahıs kullan: "Ben Yaver'im",
      "Adım Yaver". ASLA "sen Yaver" ya da "ben sen Yaver" gibi ikinci ve
      birinci şahsı karıştıran bozuk bir cümle kurma.
    - Bir aracı çağırıp bir işlemi tamamladıktan sonra (örn. LED açtın/söndün)
      SADECE ne yaptığını kısaca söyle. "iyi günler dilerim", "başka bir şey
      var mı", "yardımcı olmaktan mutluluk duyarım" gibi otomatik nezaket
      kapanışları EKLEME - kullanıcı bunu istemedi, gereksiz uzatıyor.
    - Türkçe karakterleri (ç, ğ, ı, ö, ş, ü, İ, Ç, Ğ, Ö, Ş, Ü) HER ZAMAN doğru
      kullan - "baska" değil "başka", "gunes" değil "güneş" yaz. Şapkasız
      (ASCII) yazım hem yanlış görünür hem sesli okunurken yanlış telaffuz
      edilir.

mouth:
  voice_model: C:/yaver/voices/tr_TR-dfki-medium.onnx
  output_device: null      # null = Windows varsayilani
  volume: 1.0
  synthesis:                # Piper'in SynthesisConfig'i - dinleyerek secildi
                             # (4 varyant karsilastirildi, bu en net/dogal geldi)
    length_scale: 1.05       # >1 = biraz yavas, telaffuzu netlestiriyor
    noise_scale: 0.2         # dusuk = daha az "gurultu", daha temiz ses
    noise_w_scale: 0.3       # dusuk = daha deterministik/az degisken tempo
  ack_phrases:              # uyandirma kelimesinden sonra rastgele biri soylenir
    - Efendim
    - Seni dinliyorum
    - Buyurun
    - Dinliyorum
  reply_gap_sec: 1.5        # brain cumle cumle yayinlarken aralarda kuyruk bosalabilir -
                             # bu kadar sure yeni cumle gelmezse "done" (bitti) yayinla

audio:
  input_device: 1           # null = Windows varsayilani. find_microphone.py ile numara ogren
  sample_rate: 16000        # openWakeWord ve Whisper 16 kHz ister, degistirme
  block_size: 1280          # 80 ms. openWakeWord bu boyutu bekler, degistirme

wakeword:
  enabled: false            # false: surekli dinle, cumlede trigger_word gecince cevap ver.
                            # true: openWakeWord ile ayri iki asamali uyandirma (asagidaki model/threshold kullanilir)
  trigger_word: yaver       # enabled: false iken cevap vermek icin cumlede gecmesi gereken kelime
  model: hey_jarvis         # enabled: true iken kullanilir. kendi "Yaver" modelini sonra egitecegiz
  threshold: 0.5            # dusurursen daha kolay uyanir ama yanlis alarm artar
  cooldown_sec: 2.0         # uyandiktan sonra tekrar dinlemeye gecis beklemesi
  ack_wait_sec: 3.0         # "efendim" bitene kadar en fazla bu kadar bekle

recording:
  silence_multiplier: 2.5   # ortam gurultusunun kac kati "konusma" sayilsin
  silence_sec: 0.8          # bu kadar sessizlik olunca kayit biter
  max_sec: 15
  min_sec: 0.7               # bundan kisa kayitlari coplugu at

whisper:
  model: small                 # GPU + int8_float16 ile hizli, base'den cok daha isabetli. Pi'de: tiny/base
  device: cuda                 # Pi'de: cpu
  compute_type: int8_float16   # GTX 1660'ta Tensor Core yok, float16 yavas/duzensiz calisiyordu. Pi'de: int8
  language: tr
  hotwords: "Yaver LED"        # nadir/yabanci kelimeler icin Whisper'a ipucu (yanlis duymayi azaltir).
                                # yeni bir skill nadir bir kelime/isim kullanirsa buraya da ekle
